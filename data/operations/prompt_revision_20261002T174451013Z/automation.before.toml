prompt = "在当前龙头战法聊天中，每日北京时间16:00执行完整盘后复盘、下一交易日推演和到期原预测验证。工作目录 D:\\Documents\\ChatGPT\\龙头战法，Python D:\\python\\python.exe。采用Asia/Shanghai日期和真实当前时钟。用户授权本任务使用项目已有功能进行当期必要行情、分类、公开关注度采集与完整报告；不恢复暂停的连续研究目标，不开展历史扩采、参数搜索或模型升级。每次先读AGENTS.md和README最新条目，遵循a-share-board-relay、market-data-verification、quant-backtest-integrity技能。执行参数和约束按需读取《经验假设逐项留档与冻结核验V298.md》《经验规律固定检验与分级V297.md》《背景字段冻结前重建核验V296.md》《题材与关注度时点基线V295.md》《公开结果核验与自动评分V293.md》《每日研究与自动验证V292.md》《关注度轨迹与共识数据边界V299.md》，利用V300/V301已验收研究时先读相应说明，不重跑无变化的历史验收。\n\n先核验交易所官方休市公告、有效日历、真实时间、原登记及结算状态。当前日历覆盖至2026-10-09，覆盖到期前按交易所官方公告另存扩展日历，给生产入口显式传--calendar，保留原计划日历与哈希。每日调度包含周末与节假日，但休市且无到期事项、新证据或状态变化时安静结束，不重复生成等待报告、抓旧行情或重读所有版本。目标未收盘只按需要用hypothesis_bound_daily_runner_v298.py tick读取等待状态，使用唯一新results/v298目录；不得将旧行情视为今天行情。正常批次沿用15分钟工作预算，必要步骤未完成就停在可恢复的完整节点，保存待办和缺口，不能因预算跳过核验、伪造完成或强行冻结。\n\n优先读取data/v271/expectation_registry原件，逐件确定signal、精确下一官方交易日target和全部候选。原9月30日计划目标10月8日、全11只候选不得改写、补字段或重冻。到期收盘后用public_outcome_sources_v293.py按原signal/target/calendar及--registered原登记采集，保存唯一新原始来源目录；原始响应、实际取得时间、qdate、总数、完整代码集合、哈希、失败和缺失全部保留。已知请求9月29日返回30日的冲突必须拒绝，不以请求日代替响应日。随后public_outcome_bridge_v293.py --registered原登记 --archive新来源目录 --prior-snapshot原信号日真实保存快照 --output data/v293/outcome_inbox/<目标日>/<唯一新文件>.json。无有效原快照或来源就保持未知，不临时补造。逐股核对精确到分的收盘封板价格、独立不复权日线、报价时间、昨收、明确涨停价和连续板位；低一分钱不能算封板，腾讯位置字段仅属推断，需明确价格和日线一致。禁止手填verified、晋级布尔值或固定10%猜结果。供应商覆盖不等于全A或官方证券状态认证。回封、弱转强、题材、龙头等缺证据留空，不用30分钟线编造回封或晋级代替龙头。再运行V298 tick至唯一新目录，账本仅用data/v293/settlement_ledger.jsonl追加修订；不迁移覆盖旧V292账本，历史回放不增加真实前向样本。\n\n仅当取得返回日期、完整范围已核验的新交易日行情底稿后制作新日期草稿。先读V295：point_context_v295.py collect --pool-archive新V293行情档案 --pool-date新信号日 --output唯一原始背景目录；point_context_reconciled_v295.py --parent原始目录 --output唯一派生目录。srcSecurityCode为证券代码，innerCode是内部标识；保留首档及解析纠正。当前分类仅证明采集时供应商分类，历史日期排名缺公开时间不能作实时特征。失败、过期、代码不符、双入口不一致均未知。daily_research_template_v298.py --plan新日期事实底稿JSON --output唯一新全字段草稿，不以原登记作为模板输入。仅对未审阅草稿用context_draft_bridge_v295.py --plan草稿 --archive派生背景 --output唯一补充草稿，检查全候选覆盖、取得时间不晚于截止、采集日期等于信号日、分类24小时和排名计算20分钟时效。仅补供应商分类与关注度事实，不更改股票判断、概率、事件或身份。过期重采不倒填，不把长假资料当新交易日资料。\n\n用hypothesis_review_v298.py --plan未审阅草稿 --receipt results/v297/experience_proxy_acceptance_20261002_v1/report.json --output唯一研究补充草稿引用已验收研究。完整验收实际可得时间须不晚于真实知识截止，已知标签须不晚于信号日且不能进入目标日；不可用则保留15项未检验。V298冻结/读取继续核验15项完整定义、等级、研究验收、统计与程序哈希及历史标签边界，V296继续核验context_binding原档案、投影、证券代码、程序和数据哈希及时间。删绑定、改字段/等级、缺项、来源变动、倒填时间必须报错，不能删计划/候选或换旧入口绕过。所有原预测禁止回填。\n\n当期公开关注度按V299单独采集：attention_observations_v299.py collect --pool-archive当日新原始行情档案 --pool-date新信号日 --output唯一data/v299目录，保留排名、日内轨迹、粉丝、关键词、关联的所有响应及取得/计算时间、失败；明确缺失字段只用attention_repair_v299.py --parent原档案 --output唯一补采目录一次补采，不覆盖父档案和有效字段。attention_asof_v299.py --archive原始或补采目录 --cutoff真实当前知识截止ISO时间 --output唯一研究视图JSON。完整档案与实际响应均须在截止前形成，读取重验排名/轨迹20分钟、粉丝/关键词/关联90分钟时效。需要等待资料的新草稿以真实新截止重新审阅，旧冻结截止不动。仅作独立当期研究材料，不覆盖V295背景、原预测、概率或身份。轨迹行缺代码要说明请求参数绑定限制，跨日不当日内变化；uidCount=0而占比非零时人数未知；hitCount非总讨论/独立人数，rate含义未认证，排名变化非讨论量、看多比例、资金或胜率。论坛403不绕过、不循环，不拿旧缓存或排名代替讨论分母、共识、极端化；失败不是交易失败，保留全部候选。原48只9月30日池与10月2日长假基线不当新日期行情。\n\n有可核验新交易日时输出可阅读的完整十一段报告，正文先讲市场与交易研究判断，来源、范围、截止时间和程序证据放附页，但关键未知在正文明确。十一段为：\n1. 核心判断：当天主判断、主要矛盾、下一交易日基准预期。\n2. 市场行情与赚钱/亏钱效应：指数、成交额、涨跌家数、涨跌停、炸板率、昨日涨停反馈，逐项标明范围、时间、缺口，不把含ST成交额冒充原非ST范围。\n3. 情绪周期：按项目原八阶段定义分析阶段、变化与证据，驱动因素分开，证据不足保留备选解释。\n4. 题材与轮动：主线/支线、催化、梯队、持续性与反证，供应商分类不冒充官方业务或真实主线。\n5. 连板梯队：全部冻结范围2板以上候选、各板位结构、断层和高度反馈，不只列精选。\n6. 当前龙头与空间锚：按题材位置、带动、承接和梯队证据区分已确认龙头、候选与最高板/空间锚。\n7. 老龙头与高辨识度股：按事先身份及可核验价格分析延续、补跌、反抽、反包或二波，缺证据未知，不事后追认。\n8. 关键事件与公开关注度：有证据的超/低预期、卡位、补涨、回封、弱转强，以及V299有效当期观测和共识缺口。\n9. 经验与玄学：逐项展示15项固定假设——数字板高度压制、特定日期、节前、周五、月底、龙头断板日、高标压制、名字玄学、生肖玄学、代码玄学、历史股性、地域炒作、同一实控人联动、老龙反抽、妖股记忆。每项写当天现象/涉及股票或未观察/未知、固定定义、A/B/C/D、检验状态、证据与缺口；名称字辈作为符号观察另列，不冒充产业题材。现有7项代理已测、8项缺输入不等于8项零效应，A0/B11/C2/D2、核心规则0；不因玄学提高概率或确认龙头。\n10. 下一交易日预测与预案：保留项目全部十项市场区间字段（缺依据留空），先强/正常/弱市场预案，再全候选逐股的晋级判断、题材/角色、依据、反证、触发及失效条件和观察优先级。V300/V301仅在原定义、范围、验收及截止相符时作为独立研究比较，不自动升级核心方法；名义区间覆盖不是校准概率，概率无对应样本外证据留空。不用目标日竞价倒填前日计划。\n11. 原预测验收、错误与研究质量：逐项展示到期原判断与真值、未知及覆盖，各板位评分，最近20/60真实交易日与全部监测期的Accuracy、Precision、完整正例Recall、F1、Brier和校准/全失败基线；无概率则Brier不可算，未知不算失败、不删分母，历史诊断与真实前向分开。错误、更正追加保存；说明本批新增真实前向样本、固定指标变化或不可计算原因、耗时和唯一下一步。\n\n报告、全候选表、新日期事实底稿、待审阅计划和独立研究附页使用唯一新路径，复用已有生产输出避免无意义多套报告。默认新日期计划停在待作者审阅状态，不能自动将模板标AUTHOR_REVIEWED；仅在该具体计划完成事实核验并已有真实作者审阅确认后，才用hypothesis_bound_daily_runner_v298.py freeze登记真实时间，不重复原signal。资料不足仍交付已核验部分及缺口，不凑概率或三名龙头。模型修正固定训练/验证/样本外比較，未改善不升级；无成交证据不报可交易收益或回撤，60%仅研究目标。不下订单，不向他人发送消息，不发布外部平台。交易日完成新复盘/草稿或产生实际结算、重大数据冲突、失败、必要用户处理时，在当前聊天通知并链接产物；休市或重复等待且无变化时保持安静。\n\n## 复盘与预测后的开盘重点观察卡（2026-10-03用户新增要求）\n\n每次实际完成复盘和下一交易日预测后，在第十段末尾及聊天交付末尾固定给出“开盘重点观察名单＋量化评分”，默认按现行已验收模型的原排序列前5只（可观察候选不足时3—5只或更少，不凑数），并明确模型首选。全候选原表仍保留，不因为精选删去失败或未知。休市无变化及重复等待不为了观察卡额外生成报告。\n\n用户要求使用现模型。默认评分为“模型晋级评分＝100×现模型晋级类内部原始分数”，保留一位小数，列出原始分数、模型版本、来源文件与哈希、信号日、目标日及真实知识截止；这是模型排序的显示尺度，不是校准晋级概率、盈利胜率或100分综合交易评分。不得另加主观权重、将名称/玄学/热度加进分数、改变阈值或借展示升级模型。原始分数不可用就标未知，不以名次、原晋级布尔或手填分数代替。并列沿原模型的固定规则处理，不另行挑选。\n\n每只列股票和代码、板位及目标、量化评分、原模型晋级/断板判断、事实题材/角色及未知、一字与可成交性限制、主要依据及反证、09:25和09:35观察要求、必要时10:00路径确认、触发及取消条件、待确认字段。盘后目标日竞价/盘口未发生统一标待发生，不编实时分数、不将未知记作失败；未来盘中只追加带真实时间的确认记录，不回填盘后分数或原预测。\n\n模型含一字首选、非一字正向首选、交易主选分别明确；非一字没有正向判断时写“空”，排名最高的非一字不能改写为晋级。人工条件观察可另列并使用同一原模型分数，但不能取代模型首选或调整模型前5排名。分数高不能覆盖硬风险、不可成交或证据缺口，且不作为买入阈值；原主选取消不自动换备用。\n\n新日期观察卡复用当期已经取得并核验的数据，在报告现有产物中展示并留全候选分数表；已有冻结日期只做当前独立附页，注明实际生成时间，原预测、原失败、原作者审阅、原报告及结算口径不改。没有必要不新增编号版本、审计脚本、历史验收或模型训练。"
