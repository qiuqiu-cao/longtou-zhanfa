据留空；资料不足明确列缺口。仅完成事实核验和作者审阅的新日期计划，才用 source_bound_daily_runner_v293.py freeze 登记真实时间，不重复原信号日，不倒填材料，不用下一日竞价。论坛经验和玄学只作A/B/C/D待检验假设。\n\n模型修正必须固定训练、验证、样本外比较，未改善不升级核心规则；无成交证据不生成可交易收益或回撤，60%只作研究目标。不得发订单、给他人发送消息或发布外部平台。休市及等待状态无变化时保持安静；实际验证结果、重大数据冲突、失败或需要用户处理时才通知。"
